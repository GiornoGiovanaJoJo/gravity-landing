name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # npm run build = tsc -b && vite build: типы и сборка одним гейтом.
      # Проверяем дефолтный режим (base=/site/) — это сборка для встраивания
      # в CRM, и она тоже не должна ломаться от правок.
      - name: Typecheck + build (режим встраивания в CRM)
        run: npm run build

      # Ошибка в nginx.conf иначе проявилась бы только на проде: Dockerfile
      # содержит RUN nginx -t, поэтому сборка образа её ловит.
      - name: Build image (проверяет и nginx.conf)
        run: docker build -t gravity-landing:ci .
