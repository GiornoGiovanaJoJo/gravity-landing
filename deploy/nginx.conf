# Конфиг лендинга g-neuro.space. Кладётся в /etc/nginx/conf.d/default.conf,
# то есть подключается внутрь http{} штатного nginx.conf образа — поэтому
# здесь допустимы log_format и proxy_cache_path.

log_format landing '$remote_addr fwd="$http_x_forwarded_for" proto="$http_x_forwarded_proto" '
                   'host="$host" "$request" $status $body_bytes_sent '
                   'cache=$upstream_cache_status rt=$request_time "$http_user_agent"';

# Кэш публичных GET-ответов CRM. Нужен не ради скорости, а ради лимитов:
# /api/public/{landing,branding,forms} висят на одном webhookLimiter
# (120 запросов в минуту на IP, server/src/routes.ts:48 в gravity-rpa-crm),
# а CRM работает за прокси и увидит один адрес — наш VPS. Каждая загрузка
# страницы даёт два GET, то есть без кэша ~60 просмотров в минуту выбирают
# лимит и роняют заодно чужие вебхуки на той стороне.
proxy_cache_path /var/cache/nginx/crm levels=1:2 keys_zone=crm_public:10m
                 max_size=64m inactive=10m use_temp_path=off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # default_server + «_»: принимаем любой Host — 195.161.62.56, g-neuro.space,
    # www.g-neuro.space, ffb2b3310f06.vps.myjino.ru и любые будущие домены.
    server_name _;

    access_log /var/log/nginx/access.log landing;
    root /usr/share/nginx/html;
    index index.html;

    # Реальный адрес посетителя приходит от прокси Jino (он терминирует TLS и
    # перенаправляет 80/443 на этот порт). Диапазон его адресов неизвестен, а
    # снаружи контейнер доступен только через него; на IP не завязано ничего,
    # кроме логов. После первого деплоя сузить до конкретного адреса из лога.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2 application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 2m;

    # Проверка живости: используется HEALTHCHECK контейнера и смоук-тестом деплоя.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # ── Вход и регистрация живут в CRM ───────────────────────────────────────
    # Кнопки и так ведут на абсолютный VITE_APP_URL, но src/App.tsx при
    # landingEnabled=false делает window.location.replace('/login') —
    # относительным путём, который иначе упёрся бы в SPA-fallback.
    location = /login    { return 302 https://crm.gravityrpa.ru/login$is_args$args; }
    location = /register { return 302 https://crm.gravityrpa.ru/register$is_args$args; }

    # ── API и публичные файлы CRM ────────────────────────────────────────────
    # Одна локация на оба префикса: /api/public/* (контент, брендинг, заявки)
    # и /public/landing-media/* (логотипы и аватары из админки).
    # Проксируем, а не ходим напрямую из браузера, чтобы для страницы всё было
    # одним origin и CORS вообще не участвовал — как в dev через прокси Vite.
    location ~ ^/(api|public)/ {
        # Встроенный DNS Docker. Имя в переменной, а не литералом: так nginx не
        # падает при старте, если резолвер ещё не готов, и подхватывает смену
        # адреса CRM без пересборки образа.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $crm https://crm.gravityrpa.ru;
        proxy_pass $crm$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Host и SNI — имя боевой CRM: на том адресе несколько виртуальных
        # хостов, без правильного имени не найдётся ни сайт, ни сертификат.
        proxy_set_header Host crm.gravityrpa.ru;
        proxy_ssl_server_name on;
        proxy_ssl_name crm.gravityrpa.ru;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;

        # Запрос к CRM серверный, а не браузерный: CORS в нём не участвует.
        # Origin убираем, чтобы cors() на той стороне не счёл незнакомый домен
        # поводом урезать ответ.
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        # 404 от /api/public/landing — штатный ответ: сайт живёт на дефолтах
        # из src/content.ts. Подменять его своей страницей нельзя.
        proxy_intercept_errors off;

        # Кэшируются только GET и HEAD (умолчание nginx), поэтому POST
        # /api/public/forms/:slug/submit всегда идёт насквозь.
        proxy_cache crm_public;
        proxy_cache_key "$request_method$request_uri";
        proxy_cache_valid 200 60s;
        proxy_cache_valid 404 30s;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        # CRM недоступна или ответила 429 — отдаём последний удачный ответ,
        # а не роняем контент страницы.
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504 http_429;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ── Статика ──────────────────────────────────────────────────────────────
    # Имена файлов содержат хэш содержимого — кэшируем навсегда.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /index.html  { add_header Cache-Control "no-cache" always; }
    location = /favicon.svg { expires 7d; add_header Cache-Control "public" always; }
    location = /og.png      { expires 7d; add_header Cache-Control "public" always; }
    location = /robots.txt  { expires 1d; }

    # SPA-fallback: любой неизвестный путь отдаёт страницу, а не 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Принудительный https включать только после того, как в логах видно, что
    # прокси Jino реально присылает X-Forwarded-Proto. Условие именно «= http»:
    # при отсутствии заголовка (заход по голому IP) редиректа не будет, иначе
    # посетитель уедет на https://195.161.62.56 с несовпадающим сертификатом.
    # if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
}
